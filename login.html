<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emerge Livelihoods — Organisation Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{
    --navy: #262b52;
    --navy-deep: #1b1f3d;
    --teal: #4c808b;
    --teal-light: #7fb0b9;
    --teal-pale: #dcebe9;
    --gold: #dba846;
    --paper: #f7f4ee;
    --paper-dim: #efece3;
    --ink: #262b52;
    --ink-soft: rgba(38,43,82,0.62);
    --line: rgba(38,43,82,0.14);
    --white: #ffffff;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    display:flex;
    min-height:100vh;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- LEFT: STORY PANEL ---------- */
  .story{
    position:relative;
    width: 46%;
    min-width: 380px;
    background: radial-gradient(120% 140% at 15% 10%, #323868 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--white);
    padding: 56px 56px 44px;
    display:flex;
    flex-direction:column;
    justify-content: center;
    overflow:hidden;
  }

  .story-top{ position:relative; z-index:3; display:flex; align-items:center; gap:14px; }
  .story-top img{ width:40px; height:40px; border-radius:9px; display:block; background:var(--white); padding:3px; }
  .story-top .wordmark{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; letter-spacing:0.01em; }
  .story-top .wordmark span{ color: var(--teal-light); font-style: italic; }

  .story-mid{
    position:relative; z-index:3;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--gold);
    margin: 0 0 18px;
  }
  .story-mid h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: clamp(30px, 3.6vw, 42px);
    line-height: 1.18;
    margin: 0 0 20px;
    max-width: 9.6em;
  }
  .story-mid h1 em{
    font-style: italic;
    color: var(--teal-light);
  }
  .story-mid p{
    font-size: 15px;
    line-height: 1.65;
    color: rgba(255,255,255,0.68);
    max-width: 30ch;
    margin:0;
  }

  /* signature: emergence arc */
  .arc-wrap{
    position:relative; z-index:3;
    margin-top: 44px;
    height: 132px;
  }
  .arc-wrap svg{ width:100%; height:100%; overflow:visible; }
  .arc-path{
    fill:none;
    stroke: rgba(127,176,185,0.55);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 620;
    stroke-dashoffset: 620;
    animation: draw 2.2s ease-out 0.3s forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset: 0; } }

  .arc-dot{
    animation: rise 3.4s ease-in-out infinite;
  }
  .arc-dot.d1{ animation-delay: 0.2s; }
  .arc-dot.d2{ animation-delay: 1.1s; }
  .arc-dot.d3{ animation-delay: 2.0s; }
  .arc-dot.d4{ animation-delay: 2.7s; }
  @keyframes rise{
    0%, 100%{ opacity: 0; transform: translateY(0); }
    12%{ opacity: 1; }
    50%{ opacity: 0.9; transform: translateY(-5px); }
    88%{ opacity:0; }
  }

  .story-foot{
    position:relative; z-index:3;
    display:flex; gap:34px;
    padding-top: 26px;
    border-top: 1px solid rgba(255,255,255,0.14);
  }
  .story-foot .stat b{
    display:block;
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:500;
    color: var(--white);
  }
  .story-foot .stat span{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: rgba(255,255,255,0.5);
  }

  .grain{
    position:absolute; inset:0; z-index:1;
    width:100%; height:100%;
    object-fit: cover;
    object-position: center;
    pointer-events:none;
    -webkit-user-select:none; user-select:none;
  }
  .glow{
    position:absolute; z-index:2; border-radius:50%;
    filter: blur(60px); pointer-events:none;
  }
  .glow.g1{ width:260px; height:260px; background: rgba(219,168,70,0.20); top:-60px; right:-60px; }
  .glow.g2{ width:220px; height:220px; background: rgba(127,176,185,0.22); bottom:-40px; left:-40px; }

  /* ---------- RIGHT: FORM PANEL ---------- */
  .form-panel{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 32px;
    position:relative;
  }

  .form-panel::before{
    content:'';
    position:absolute; inset:0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(circle at 65% 40%, black, transparent 62%);
    mask-image: radial-gradient(circle at 65% 40%, black, transparent 62%);
    opacity: 0.5;
    pointer-events:none;
  }

  .card{
    position:relative;
    width:100%;
    max-width: 396px;
  }

  .card-head{ margin-bottom: 30px; }
  .card-head-center{ text-align:center; }
  .card-logo{
    width:180px; height:88px;
    object-fit: contain;
    display:block;
    margin: 0 auto 20px;
  }
  .card-head .tag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--teal);
    margin: 0 0 10px;
  }
  .card-head h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size: 30px;
    margin: 0 0 8px;
    color: var(--navy-deep);
  }
  .card-head p{
    margin:0;
    font-size: 14px;
    color: var(--ink-soft);
    line-height:1.5;
  }

  form{ display:flex; flex-direction:column; gap: 18px; margin-top: 28px; }

  .field{ display:flex; flex-direction:column; gap:7px; }
  .field label{
    font-size: 12.5px;
    font-weight:600;
    color: var(--navy-deep);
    letter-spacing:0.01em;
  }
  .input-shell{
    position:relative;
    display:flex; align-items:center;
    border:1.5px solid var(--line);
    border-radius: 10px;
    background: var(--white);
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .input-shell:focus-within{
    border-color: var(--teal);
    box-shadow: 0 0 0 4px var(--teal-pale);
  }
  .input-shell svg{ margin-left:13px; flex-shrink:0; color: var(--ink-soft); }
  .input-shell input{
    width:100%;
    border:none; outline:none; background:transparent;
    padding: 12.5px 12px;
    font-family:'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--navy-deep);
  }
  .input-shell input::placeholder{ color: rgba(38,43,82,0.34); }

  .toggle-visibility{
    background:none; border:none; cursor:pointer;
    margin-right: 10px; padding:6px;
    color: var(--ink-soft);
    display:flex; align-items:center;
  }
  .toggle-visibility:hover{ color: var(--teal); }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    font-size: 13px;
    margin-top: 2px;
  }
  .remember{ display:flex; align-items:center; gap:8px; color: var(--ink-soft); cursor:pointer; user-select:none; }
  .remember input{
    appearance:none; -webkit-appearance:none;
    width:16px; height:16px; border-radius:5px;
    border: 1.5px solid var(--line);
    display:grid; place-content:center;
    cursor:pointer;
  }
  .remember input::after{
    content:''; width:8px; height:8px; border-radius:2px;
    background: var(--teal);
    transform: scale(0);
    transition: transform 0.12s ease;
  }
  .remember input:checked::after{ transform: scale(1); }
  .remember input:checked{ border-color: var(--teal); }

  .row-between a{
    color: var(--teal);
    text-decoration:none;
    font-weight:600;
  }
  .row-between a:hover{ text-decoration:underline; }

  .submit-btn{
    margin-top: 6px;
    border:none; cursor:pointer;
    background: var(--navy-deep);
    color: var(--white);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 14.5px;
    padding: 13.5px 18px;
    border-radius: 10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: background 0.18s ease, transform 0.12s ease;
  }
  .submit-btn:hover{ background: var(--teal); }
  .submit-btn:active{ transform: translateY(1px); }
  .submit-btn svg{ transition: transform 0.18s ease; }
  .submit-btn:hover svg{ transform: translateX(3px); }

  .submit-btn:focus-visible, .input-shell input:focus-visible, .remember input:focus-visible, .row-between a:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .demo-hint{
    margin-top: 24px;
    display:flex; flex-direction:column; gap:3px;
    background: var(--teal-pale);
    border: 1px dashed var(--teal-light);
    border-radius: 10px;
    padding: 10px 14px;
    text-align:center;
  }
  .demo-hint b{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--teal);
  }
  .demo-hint span{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--navy-deep);
  }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin: 26px 0 18px;
    color: var(--ink-soft);
    font-size: 12px;
  }
  .divider::before, .divider::after{
    content:''; flex:1; height:1px; background: var(--line);
  }

  .helper{
    text-align:center;
    font-size: 13px;
    color: var(--ink-soft);
    line-height:1.6;
  }
  .helper a{ color: var(--navy-deep); font-weight:600; text-decoration:none; border-bottom: 1.5px solid var(--teal); }

  .status{
    display:none;
    align-items:center; gap:8px;
    background: var(--teal-pale);
    color: var(--navy-deep);
    border-radius: 9px;
    padding: 10px 13px;
    font-size: 13px;
    margin-top: 4px;
  }
  .status.show{ display:flex; }
  .status.error{ background: #fbe4e0; color: #93341c; }
  .status.error svg{ color: #93341c; }

  /* ================= RESPONSIVE ================= */

  /* Tablets and small laptops */
  @media (max-width: 1024px){
    .story{ width: 42%; min-width: 320px; padding: 48px 40px; }
    .form-panel{ padding: 40px 28px; }
  }

  /* Large phones / small tablets in portrait: keep the photo panel on the left, just narrower */
  @media (max-width: 880px){
    .story{
      width: 38%; min-width: 220px;
      padding: 32px 24px;
    }
    .story-mid{ margin-top:0; }
    .arc-wrap{ height:90px; }
    .form-panel{ padding: 36px 24px 56px; }
    .card{ max-width: 440px; margin: 0 auto; }
  }

  /* Standard phones (portrait) */
  @media (max-width: 600px){
    .story{ width: 34%; min-width: 150px; padding: 24px 16px; }
    .story-top .wordmark{ font-size:15px; }
    .story-mid h1{ font-size: clamp(20px, 5vw, 26px); max-width: none; }
    .story-mid p{ display:none; }
    .arc-wrap{ height:64px; margin-top:24px; }
    .story-foot{ gap:16px; padding-top:16px; }
    .story-foot .stat b{ font-size:16px; }
    .story-foot .stat span{ font-size:8.5px; }
    .form-panel{ padding: 30px 18px 48px; }
    .card-logo{ width:150px; height:74px; }
    .card-head h2{ font-size: 25px; }
    .card-head p{ font-size: 13.5px; }
    form{ gap:16px; margin-top:22px; }
    /* 16px min font-size on inputs prevents iOS Safari auto-zoom on focus */
    .input-shell input{ font-size:16px; padding: 13px 12px; }
    .submit-btn{ font-size:15px; padding: 14px 16px; }
    .divider{ margin: 22px 0 16px; }
  }

  /* Small phones (e.g. iPhone SE, Galaxy S8) */
  @media (max-width: 400px){
    .story{ width: 30%; min-width: 110px; padding: 18px 10px; }
    .story-top .wordmark{ display:none; }
    .arc-wrap{ height:48px; }
    .story-foot{ flex-direction:column; gap:10px; }
    .form-panel{ padding: 26px 14px 44px; }
    .card{ max-width: 100%; }
    .card-logo{ width:130px; height:66px; margin-bottom:16px; }
    .card-head{ margin-bottom: 22px; }
    .card-head h2{ font-size: 22px; }
    .row-between{
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }
    .divider{ margin: 20px 0 14px; }
    .helper{ font-size: 12.5px; }
  }

  /* Very small / narrow phones */
  @media (max-width: 340px){
    .story{ width: 26%; min-width: 90px; padding: 14px 8px; }
    .arc-wrap{ height:38px; }
    .form-panel{ padding: 22px 12px 36px; }
    .card-logo{ width:112px; height:58px; }
    .card-head h2{ font-size: 20px; }
    .card-head .tag{ font-size: 10px; }
    .input-shell svg{ margin-left:10px; }
    .submit-btn{ font-size:14px; padding: 12.5px 14px; }
  }

  /* Touch devices: guarantee comfortable tap targets regardless of screen size */
  @media (pointer: coarse){
    .toggle-visibility{ padding:10px; margin-right:6px; }
    .remember input{ width:19px; height:19px; }
    .row-between a{ padding:4px 0; }
    .submit-btn{ min-height:48px; }
  }

  /* Short viewports / landscape phones */
  @media (max-height: 480px) and (orientation: landscape){
    body{ flex-direction:row; }
    .story{ width:38%; min-width:220px; padding:20px; min-height:auto; }
    .story-mid{ display:none; }
    .form-panel{ padding: 20px 24px; align-items:center; }
    .card-head{ margin-bottom: 16px; }
    .card-logo{ margin-bottom:12px; }
    form{ gap:12px; margin-top:16px; }
  }
</style>
</head>

AAAElFTkSuQmCC" alt="Emerge Livelihoods">
        <h2 id="formHeading">Sign in to your dashboard</h2>
        <p id="formSubheading">Enter Your Credentials.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field" id="fullNameField" style="display:none;">
          <label for="fullName">Full name</label>
          <div class="input-shell">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="fullName" placeholder="Jane Banda" autocomplete="name">
          </div>
        </div>

        <div class="field">
          <label for="email">Work email</label>
          <div class="input-shell">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/><path d="m4 6 8 7 8-7"/></svg>
            <input type="email" id="email" placeholder="you@emergelivelihoods.org" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-shell">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-visibility" id="toggleBtn" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between" id="rememberRow">
          <label class="remember"><input type="checkbox" id="remember"> Keep me signed in</label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Sign in
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>

        <div class="status" id="status">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          <span id="statusText">Checking your details…</span>
        </div>
      </form>

      <div class="divider" id="switchDivider">new to the platform</div>
      <p class="helper" id="switchHelper"><a href="#" id="switchModeLink">Create an account</a> or contact ICT Team.</p>
    </div>
  </div>

<script>
  const toggleBtn = document.getElementById('toggleBtn');
  const pwd = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  toggleBtn.addEventListener('click', () => {
    const isPw = pwd.type === 'password';
    pwd.type = isPw ? 'text' : 'password';
    toggleBtn.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');
    eyeIcon.innerHTML = isPw
      ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c7 0 10.5 7 10.5 7a13.3 13.3 0 0 1-3.1 3.9M6.3 6.3C3.4 8.1 1.5 12 1.5 12s3.5 7 10.5 7c1.4 0 2.7-.3 3.8-.7"/>'
      : '<path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>';
  });

  const form = document.getElementById('loginForm');
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const submitBtn = document.getElementById('submitBtn');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const fullNameField = document.getElementById('fullNameField');
  const fullNameInput = document.getElementById('fullName');
  const formHeading = document.getElementById('formHeading');
  const formSubheading = document.getElementById('formSubheading');
  const rememberRow = document.getElementById('rememberRow');
  const switchModeLink = document.getElementById('switchModeLink');
  const switchHelper = document.getElementById('switchHelper');

  let mode = 'signin'; // 'signin' | 'signup'

  function setMode(next){
    mode = next;
    status.classList.remove('show', 'error');
    if (mode === 'signup'){
      formHeading.textContent = 'Create your account';
      formSubheading.textContent = 'Set up access to the Excel Import Desk.';
      fullNameField.style.display = '';
      rememberRow.style.display = 'none';
      submitBtn.firstChild.textContent = 'Create account ';
      switchHelper.innerHTML = 'Already have an account? <a href="#" id="switchModeLink">Sign in</a>';
    } else {
      formHeading.textContent = 'Sign in to your dashboard';
      formSubheading.textContent = 'Enter Your Credentials.';
      fullNameField.style.display = 'none';
      rememberRow.style.display = '';
      submitBtn.firstChild.textContent = 'Sign in ';
      switchHelper.innerHTML = '<a href="#" id="switchModeLink">Create an account</a> or contact ICT Team.';
    }
    // The link was replaced via innerHTML above, so rebind its listener.
    document.getElementById('switchModeLink').addEventListener('click', (e) => {
      e.preventDefault();
      setMode(mode === 'signin' ? 'signup' : 'signin');
    });
  }
  switchModeLink.addEventListener('click', (e) => {
    e.preventDefault();
    setMode(mode === 'signin' ? 'signup' : 'signin');
  });

  // If already logged in, skip straight to the workbench.
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data && data.session){
      window.location.href = 'workbench.html';
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if(!form.checkValidity()){ form.reportValidity(); return; }

    status.classList.remove('error');
    status.classList.add('show');
    submitBtn.style.opacity = '0.7';
    submitBtn.style.pointerEvents = 'none';

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    const fullName = fullNameInput.value.trim();

    try{
      if (mode === 'signup'){
        statusText.textContent = 'Creating your account…';
        const { data, error } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { full_name: fullName } }
        });
        if (error) throw error;

        if (data.session){
          statusText.textContent = 'Account created — redirecting…';
          setTimeout(() => { window.location.href = 'workbench.html'; }, 600);
        } else {
          // Email confirmation is enabled on this Supabase project.
          status.classList.remove('error');
          statusText.textContent = 'Account created. Check your email to confirm, then sign in.';
          submitBtn.style.opacity = '1';
          submitBtn.style.pointerEvents = 'auto';
          setMode('signin');
        }
      } else {
        statusText.textContent = 'Checking your details…';
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        statusText.textContent = 'Success — redirecting to the Excel Import Desk…';
        setTimeout(() => { window.location.href = 'workbench.html'; }, 500);
      }
    } catch (err){
      status.classList.add('error');
      statusText.textContent = err && err.message ? err.message : 'Something went wrong. Please try again.';
      submitBtn.style.opacity = '1';
      submitBtn.style.pointerEvents = 'auto';
    }
  });
</script>
</body>
</html>
